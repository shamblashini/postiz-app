name: "Build Coolify Image"

# Builds the image used by docker-compose.coolify.yaml, so Coolify only
# pulls it instead of building Postiz on every deploy.
on:
  workflow_dispatch:
  push:
    branches:
      - coolify
    paths-ignore:
      - 'docker-compose.coolify.yaml'

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/${{ github.repository }}:coolify \
            -t ghcr.io/${{ github.repository }}:coolify-${{ github.sha }} \
            --build-arg NEXT_PUBLIC_VERSION=coolify-${{ github.sha }} \
            --pull \
            --provenance=false --sbom=false \
            --push .
