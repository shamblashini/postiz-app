# Postiz for Coolify, built from this repository (includes the Ukrainian translation).
#
# Based on Coolify's own Postiz template:
# https://github.com/coollabsio/coolify/blob/main/templates/compose/postiz.yaml
# The difference: the postiz service uses the image that the
# "Build Coolify Image" GitHub Action builds from the coolify branch
# (.github/workflows/build-coolify-image.yml) instead of
# ghcr.io/gitroomhq/postiz-app. Coolify pulls it, nothing is built on deploy.
# After a push, wait for the Action to finish, then redeploy.
#
# Coolify setup:
#   1. New Resource > Public/Private Repository > this fork, branch `coolify`.
#   2. Build Pack: Docker Compose, Docker Compose Location: /docker-compose.coolify.yaml
#   3. Set the domain of the `postiz` service (Coolify routes it to port 5000).
#   4. Fill the variables you need in the Environment Variables tab, then Deploy.
#
# SERVICE_URL_* and SERVICE_PASSWORD_* values are generated by Coolify.

services:
  postiz:
    image: ghcr.io/shamblashini/postiz-app:coolify
    environment:
      - SERVICE_URL_POSTIZ_5000
      - MAIN_URL=${SERVICE_URL_POSTIZ}
      - FRONTEND_URL=${SERVICE_URL_POSTIZ}
      - NEXT_PUBLIC_BACKEND_URL=${SERVICE_URL_POSTIZ}/api
      - JWT_SECRET=${SERVICE_PASSWORD_JWTSECRET}
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRESQL}@postgres:5432/postiz-db
      - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - TEMPORAL_ADDRESS=temporal:7233
      - IS_GENERAL=true
      - NX_ADD_PLUGINS=false

      # Registration. Sign-ups through the generic OAuth/OIDC provider below
      # are always allowed, even when this is true: limit who can open the
      # application in your identity provider instead.
      - DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-false}

      # Single sign-on with Authentik (or any OpenID Connect provider).
      # In Authentik: create an OAuth2/OpenID provider + application, set the
      # redirect URI to <your Postiz URL>/settings, then set
      # POSTIZ_GENERIC_OAUTH=true, POSTIZ_OAUTH_CLIENT_ID,
      # POSTIZ_OAUTH_CLIENT_SECRET and POSTIZ_OAUTH_URL to the issuer, for
      # example https://auth.example.com/application/o/<application slug>/
      # The endpoints are read from its OpenID configuration. The three
      # *_AUTH/TOKEN/USERINFO_URL are only for providers without discovery.
      # Postiz checks only whether POSTIZ_GENERIC_OAUTH is set, not its value:
      # "false" counts as on, leave it empty to hide the button.
      - POSTIZ_GENERIC_OAUTH=${POSTIZ_GENERIC_OAUTH:-}
      - NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME=${POSTIZ_OAUTH_DISPLAY_NAME:-Authentik}
      - NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL=${POSTIZ_OAUTH_LOGO_URL:-https://raw.githubusercontent.com/walkxcode/dashboard-icons/master/png/authentik.png}
      - POSTIZ_OAUTH_URL=${POSTIZ_OAUTH_URL}
      - POSTIZ_OAUTH_CLIENT_ID=${POSTIZ_OAUTH_CLIENT_ID}
      - POSTIZ_OAUTH_CLIENT_SECRET=${POSTIZ_OAUTH_CLIENT_SECRET}
      - POSTIZ_OAUTH_AUTH_URL=${POSTIZ_OAUTH_AUTH_URL:-}
      - POSTIZ_OAUTH_TOKEN_URL=${POSTIZ_OAUTH_TOKEN_URL:-}
      - POSTIZ_OAUTH_USERINFO_URL=${POSTIZ_OAUTH_USERINFO_URL:-}

      # Storage: "local" keeps uploads in the postiz_uploads volume.
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - UPLOAD_DIRECTORY=/uploads
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_ACCESS_KEY=${CLOUDFLARE_ACCESS_KEY}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}
      - CLOUDFLARE_BUCKETNAME=${CLOUDFLARE_BUCKETNAME}
      - CLOUDFLARE_BUCKET_URL=${CLOUDFLARE_BUCKET_URL}
      - CLOUDFLARE_REGION=${CLOUDFLARE_REGION}

      # Email: "resend", "ses" or "nodemailer". Left empty, new users are
      # activated without an email.
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}

      # Optional encryption of channel tokens in the database.
      # ENCRYPTION_PROVIDER=local and ENCRYPTION_KEY=$(openssl rand -base64 32).
      # Keep the key safe: without it every channel has to be connected again.
      - ENCRYPTION_PROVIDER=${ENCRYPTION_PROVIDER}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      # Social media apps: add the ones you use, names as in .env.example.
      - X_API_KEY=${X_API_KEY}
      - X_API_SECRET=${X_API_SECRET}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}
      - THREADS_APP_ID=${THREADS_APP_ID}
      - THREADS_APP_SECRET=${THREADS_APP_SECRET}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
      - TIKTOK_CLIENT_ID=${TIKTOK_CLIENT_ID}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - MASTODON_URL=${MASTODON_URL:-https://mastodon.social}
      - MASTODON_CLIENT_ID=${MASTODON_CLIENT_ID}
      - MASTODON_CLIENT_SECRET=${MASTODON_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - postiz_config:/config/
      - postiz_uploads:/uploads/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 120s

  postgres:
    image: postgres:17-alpine
    volumes:
      - postiz_postgresql_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESQL}
      - POSTGRES_DB=postiz-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-postiz-db}"]
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:7.2
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS}
    volumes:
      - postiz_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${SERVICE_PASSWORD_REDIS}
        - ping
      interval: 5s
      timeout: 10s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${SERVICE_PASSWORD_POSTGRESQL}
      - POSTGRES_SEEDS=postgres
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    depends_on:
      postgres:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postiz_config:
  postiz_uploads:
  postiz_postgresql_data:
  postiz_redis_data:
  temporal_elasticsearch_data:
